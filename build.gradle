plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.173'
    id 'com.modrinth.minotaur' version "2.+"
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "Github"
        url = "https://easynull.github.io/nullcore/"  // Замените на ваш URL
    }
}
base {
    archivesName = mod_name
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "${mod_id}"
    versionNumber = "${mod_version}"
    versionType = "release"
    uploadFile = jar
    gameVersions = ["1.21.4"]
    loaders = ["neoforge"]
    changelog = rootProject.file("changelog.md").text
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : project.name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = group
            artifactId = project.name
            version = version

            from components.java

            pom {
                name = project.name
                description = 'API mod by MW Team'
                url = 'https://github.com/easynull/NullCore'

                licenses {
                    license {
                        name = mod_license
                        url = 'https://www.gnu.org/licenses/gpl-2.0.html'
                    }
                }

                developers {
                    developer {
                        id = 'easynull'
                        name = 'easynull'
                        email = 'null@example.com'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/easynull/NullCore.git'
                    developerConnection = 'scm:git:ssh://github.com/easynull/NullCore.git'
                    url = 'https://github.com/easynull/NullCore'
                }
            }
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("$buildDir/maven-publish")
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}