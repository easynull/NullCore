name: Release Mod

on:
  workflow_dispatch:
  push:
    branches: [ "1.21.4" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    environment: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version info
        id: versions
        run: |
          MOD_VERSION=$(grep -oP 'mod_version\s*=\s*"\K[^"]+' gradle.properties)
          MC_VERSION=$(grep -oP 'minecraft_version\s*=\s*"\K[^"]+' gradle.properties)
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV
          echo "MC_VERSION=$MC_VERSION" >> $GITHUB_ENV
          echo "VERSION=v${MOD_VERSION}-${MC_VERSION}" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build all modules
        run: |
          ./gradlew :fabric:build :neo:build --stacktrace

      - name: Collect artifacts
        id: collect-jars
        run: |
          # Fabric JAR
          FABRIC_JAR=$(ls fabric/build/libs/*-${MOD_VERSION}.jar | head -1)
          echo "FABRIC_JAR=$FABRIC_JAR" >> $GITHUB_ENV
          
          # NeoForge JAR
          NEO_JAR=$(ls neo/build/libs/*-${MOD_VERSION}.jar | head -1)
          echo "NEO_JAR=$NEO_JAR" >> $GITHUB_ENV
          
          # Список всех JAR для релиза
          echo "ARTIFACTS=${FABRIC_JAR},${NEO_JAR}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }} (MC ${{ env.MC_VERSION }})
          body: |
            ### Minecraft ${{ env.MC_VERSION }}
            - **Fabric**: `$(basename ${{ env.FABRIC_JAR }})`
            - **NeoForge**: `$(basename ${{ env.NEO_JAR }})`
          files: |
            ${{ env.FABRIC_JAR }}
            ${{ env.NEO_JAR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  modrinth:
    needs: release
    environment: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('/*.gradle*','/gradle-wrapper.properties') }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Publish to Modrinth
        run: ./gradlew modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  curseforge:
    needs: release
    environment: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('/*.gradle*','/gradle-wrapper.properties') }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Publish to CurseForge
        run: ./gradlew curseforge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}