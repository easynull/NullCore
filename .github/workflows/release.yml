name: Release Mod

on:
  workflow_dispatch: # Allows manual triggering
  push:
    branches: [ "1.21.4-neoforge" ] # Trigger on pushes to this branch
    paths:
      - 'build.gradle'
      - 'gradle.properties' # Include this to trigger on version changes

permissions:
  contents: write # Required to create releases

jobs:
  build:
    environment: Release # Optional, defines an environment
    runs-on: ubuntu-latest # Runs on Ubuntu Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Checks out the repository

      - name: Extract versions from Gradle
        id: get_version # Unique ID for this step
        run: |
          MOD_VERSION=$(grep -oP 'mod_version\s*=\s*\K.+' gradle.properties)
          MC_VERSION=$(grep -oP 'minecraft_version\s*=\s*\K.+' gradle.properties)
          VERSION=$MOD_VERSION-$MC_VERSION # Combined version for release tag
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV # Sets environment variable
          echo "MC_VERSION=$MC_VERSION" >> $GITHUB_ENV # Sets environment variable
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT # Sets output variable
          echo "minecraft_version=$MC_VERSION" >> $GITHUB_OUTPUT # Sets output variable
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash # Explicitly use bash

      - name: Set up JDK
        uses: actions/setup-java@v4 # Sets up Java environment
        with:
          distribution: 'temurin' # Uses Temurin JDK
          java-version: 21 # Sets Java version to 21

      - name: Cache Gradle dependencies
        uses: actions/cache@v3 # Caches Gradle dependencies
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('/*.gradle*','/gradle-wrapper.properties') }} # Cache key

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3 # Sets up Gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew # Make gradlew executable

      - name: Build the mod
        run: ./gradlew build # Builds the mod

      - name: Create Release
        id: create_release # Unique ID for this step
        uses: softprops/action-gh-release@v1 # Creates a GitHub release
        with:
          tag_name: ${{ env.VERSION }} # Uses combined version as tag
          name: Release ${{ env.VERSION }} # Release name
          body: |
            Release of version ${{ env.VERSION }}

            - Add your changelog here.
          draft: false # Publish the release immediately
          prerelease: false  # or true if it's a pre-release
          files: build/libs/*-${{ env.MOD_VERSION }}.jar # Path to your mod JAR (adjust if needed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Access token for GitHub API

  publish-modrinth:
    needs: build # Ensure build job completes successfully first
    environment: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Checks out the repository

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore Gradle Cache
        uses: actions/cache@v3 # Restore gradle cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('/*.gradle*','/gradle-wrapper.properties') }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3 # Sets up Gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew # Make gradlew executable
      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }} # Modrinth API token
        run: ./gradlew modrinthPublish # Publishes to Modrinth