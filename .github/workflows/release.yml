name: Release Mod

on:
  workflow_dispatch:
  push:
    branches: [ "1.21.4-neoforge" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    environment: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit message
        id: commit_message
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "COMMIT_MESSAGE=${COMMIT_MSG}" >> $GITHUB_ENV

      - name: Extract versions from Gradle
        id: get_version
        run: |
          MOD_VERSION=$(grep -oP 'mod_version\s*=\s*\K.+' gradle.properties)
          MC_VERSION=$(grep -oP 'minecraft_version\s*=\s*\K.+' gradle.properties)
          VERSION=$MOD_VERSION
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV
          echo "MC_VERSION=$MC_VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "minecraft_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('/*.gradle*','/gradle-wrapper.properties') }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build the mod
        run: ./gradlew build
      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal

      - name: Publish to GitHub Packages
        run: ./gradlew publishToMavenCentral
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v3
        with:
          source: .gradle/maven-publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2